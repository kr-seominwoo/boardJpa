<html xmlns:th=http://www.thymeleaf.org>
<!-- 댓글 -->
<div th:fragment="CommentFragment(member, comment)" th:id="${comment.id}" class="comment_item">
    <div class="comment_area">
        <div class="comment_wrap">
            <div th:if="${comment.blind == 1}" class="comment">
                <div class="comment_content">삭제된 댓글입니다</div>
            </div>

            <th:block th:if="${comment.blind == 0}">
                <div th:if="${comment.blind == 0}" class="comment">
                    <div class="nickname">[[${comment.writer}]]</div>
                    <div class="comment_content">[[${comment.content}]]</div>
                    <div class="comment_date">[[${comment.regdate}]]</div>
                    <button class="btn_like_unlike btn_like_unlike_small" onclick="like(this)">👍</button><span class="like like_unlike_count">[[${comment.likes}]]</span>
                    <button class="btn_like_unlike btn_like_unlike_small" onclick="dislike(this)">👎</button><span class="unlike like_unlike_count">[[${comment.dislike}]]</span>
                    <button class="comment_btn" onclick="toggleReplyWriter(this)">답글</button>
                    <th:block th:if="${member != null && member.id == comment.memberId}">
                        <button class="comment_btn edit_writer_trigger" onclick="switchCommentToEditor(this)">수정</button>
                        <button class="comment_btn delete_comment_btn" onclick="deleteComment(this)">삭제</button>
                    </th:block>
                </div>
                <div th:if="${member.id != null && member.id == comment.memberId}" class="comment_editor hidden">
                    <div class="nickname">[[${member.nickname}]]</div>
                    <textarea class="comment_input_area" rows="1" placeholder="댓글을 입력하세요"
                              onkeyup="resize(this)"></textarea>
                    <div class="comment_btn_box">
                        <button class="comment_btn cancel_comment_btn" onclick="cancelEditComment(this)">취소</button>
                        <button class="comment_btn edit_comment_btn" onclick="editComment(this)">댓글 수정</button>
                    </div>
                </div>

                <div th:replace="~{/commentWriter :: CommentWriterFragment(member=${member}, comment=${comment}, hidden='hidden')}"></div>
            </th:block>

            <button class="comment_btn blank_bottom reply_trigger" onclick="loadReply(this)"
                    th:attr="url=|/community/board/${category}/${postId}/comment/reply/${comment.id}|" first>답글 보기</button>
            <!-- 대댓글 -->
            <div class="comment_reply_list">
            </div>
        </div>
    </div>
</div>
</html>
