<html xmlns:th=http://www.thymeleaf.org>
<div class="comment_header">
    전체 댓글 수 <span>[[${commentTotal}]]</span>개
</div>
<ul id ="comment_list" class="comment_list">
    <th:block th:if="${commentList != null}">
    <li class="comment_group" th:each="comment : ${commentList}">
        <!-- 댓글 -->
        <div th:replace="~{/comment :: CommentFragment(member=${member}, comment=${comment})}"></div>
    </li>
    </th:block>
</ul>
<div class="page_box">
    <ul>
        <li th:if="${begin > 1}" id="prev" class="page" onclick="loadComment('${category}', ${postId}, ${begin - 1})">&lt;</li>
        <li th:if="${begin <= end}" th:each="index : ${#numbers.sequence(begin, end)}" class="page" name="${index}" onclick="loadComment('${category}', ${postId}, ${index})">
            <strong th:if="${index == page}">[[${index}]]</strong>
            <th:block th:if="${index != page}">
                [[${index}]]
            </th:block>
        </li>

        <li th:if="${lastPage > end}" id="next"  class="page" onclick="loadComment('${category}', ${postId}, ${end + 1})">&gt;</li>
    </ul>
</div>
<div th:replace="~{/commentWriter :: CommentWriterFragment(member=${member}, comment=${comment}, hidden='')}"></div>
</html>
