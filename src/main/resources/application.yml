server:
  servlet:
    context-path: /community

spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/board;MODE=MySQL
    username: sa
    password: 1q
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none # 애플리케이션 실행 시점에 테이블 다 지우고 다시 생성해줌
    properties:
      hibernate:
        #        show_sql: true # 실행 되는 sql을 콘솔에 보여줌. 따라서 실제운영에서는 사용하면 안됨
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace
